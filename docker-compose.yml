version: '3.8'

services:
  # 主应用
  autonews-analyzer:
    build: .
    container_name: autonews-analyzer
    ports:
      - "8080:8080"
      - "9090:9090"
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/autonews
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ./data:/app/data
      - ./config:/app/config
    depends_on:
      - postgres
      - redis
    networks:
      - autonews-network
    restart: unless-stopped

  # PostgreSQL数据库
  postgres:
    image: postgres:15-alpine
    container_name: autonews-postgres
    environment:
      POSTGRES_DB: autonews
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - autonews-network
    restart: unless-stopped

  # Redis缓存
  redis:
    image: redis:7-alpine
    container_name: autonews-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - autonews-network
    restart: unless-stopped

  # 监控面板
  grafana:
    image: grafana/grafana:latest
    container_name: autonews-grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - autonews-network
    restart: unless-stopped

  # 指标收集
  prometheus:
    image: prom/prometheus:latest
    container_name: autonews-prometheus
    ports:
      - "9091:9090"
    volumes:
      - prometheus_data:/prometheus
      - ./deployments/prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    networks:
      - autonews-network
    restart: unless-stopped

networks:
  autonews-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  grafana_data:
  prometheus_data: